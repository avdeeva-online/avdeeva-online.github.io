<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111318">
  <title>ARCHIVE.EXE</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="noise"></div>

<header class="mast">
  <div class="mast-art" aria-hidden="true">
    <div class="orb orb-a"></div><div class="orb orb-b"></div>
    <div class="scan"></div>
    <div class="terminal-lines">ARCHIVE NODE 00<br>CHARACTER STORAGE<br>STATUS: ONLINE</div>
  </div>
  <div class="mast-content">
    <a class="brand" href="#" data-reset>
      <span class="brand-main">ARCHIVE.EXE<span class="cursor">_</span></span>
      <span class="brand-sub">character database</span>
    </a>
    <div class="mast-copy">
      <span>INDEX_00 / CHARACTER ARCHIVE</span>
      <span id="totalMeta">000 RECORDS</span>
    </div>
  </div>
</header>

<main class="layout">
  <aside class="catalog-sidebar" id="catalogSidebar">
    <div class="sidebar-head">
      <div>
        <div class="sidebar-kicker">CATALOG_</div>
        <div class="sidebar-title">BROWSE INDEX</div>
      </div>
      <button class="sidebar-close" id="sidebarClose" aria-label="Hide catalog">‹</button>
    </div>

    <div class="sidebar-tabs">
      <button class="sidebar-tab active" data-side-tab="author">AUTHORS</button>
      <button class="sidebar-tab" data-side-tab="universe">UNIVERSES</button>
      <button class="sidebar-tab" data-side-tab="genre">GENRES</button>
    </div>

    <label class="sidebar-search">
      <span>FIND_</span>
      <input id="sidebarSearch" placeholder="Filter list...">
    </label>

    <div class="sidebar-list" id="sidebarList"></div>
  </aside>

  <div class="catalog-main">
  <button class="sidebar-open" id="sidebarOpen">☰ CATALOG</button>
  <section class="controls">
    <label class="search">
      <span>SEARCH_</span>
      <input id="searchInput" autocomplete="off" placeholder="Search by name, author, universe or tag...">
    </label>
    <div class="filter-row">
      <button class="select-like" id="authorBtn"><b>◉</b> AUTHOR <span>ALL</span></button>
      <button class="select-like" id="universeBtn"><b>⌁</b> UNIVERSE <span>ALL</span></button>
      <button class="select-like" id="tagBtn"><b>#</b> TAG <span>ALL</span></button>
      <button class="select-like" id="loreBtn"><b>▤</b> LOREBOOK <span>ALL</span></button>
      <button class="select-like" id="sortBtn"><b>↕</b> SORT <span>NEWEST</span></button>
      <button class="ghost" id="clearBtn">RESET</button>
    </div>
    <div id="activeFilters" class="active-filters"></div>
  </section>

  <section class="catalog-head">
    <div><span class="dot"></span><span id="resultCount">0</span> RECORDS FOUND</div>
    <button id="randomBtn" class="random-btn">RANDOM_01 ↝</button>
  </section>

  <section id="grid" class="grid"></section>
  <div id="empty" class="empty" hidden>NO MATCHES</div>
  </div>
</main>

<footer><span>ARCHIVE.EXE / INDEX_00</span><span>v0.2 / ONLINE</span></footer>
<div id="menu" class="menu" hidden></div>

<div id="modal" class="modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <button class="modal-nav modal-prev" id="prevBot" aria-label="Previous random character">‹</button>
  <article class="modal-card" role="dialog" aria-modal="true">
    <button class="modal-close" data-close>×</button>
    <div class="modal-media"><img id="modalImage" alt=""></div>
    <div class="modal-body">
      <button class="modal-kicker" id="modalUniverse"></button>
      <h2 id="modalTitle"></h2>
      <button class="author-link" id="modalAuthor"></button>
      <p class="modal-short" id="modalShort"></p>
      <div class="divider"></div>
      <div class="section-label">SCENARIO</div>
      <p class="modal-full" id="modalFull"></p>
      <div class="tag-list" id="modalTags"></div>
      <div class="modal-actions">
        <a class="primary-action" id="openBot" target="_blank" rel="noopener">OPEN BOT ↗</a>
        <a class="secondary-action" id="downloadBot" download>BOT CARD ↓</a>
        <a class="secondary-action" id="downloadLore" download>LOREBOOK ↓</a>
      </div>
    </div>
  </article>
  <button class="modal-nav modal-next" id="nextBot" aria-label="Next random character">›</button>
</div>

<script src="data.js"></script><script src="app.js"></script>
</body></html>
