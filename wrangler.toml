name = "archive-exe"
main = "src/cloudflare-entry-v2.js"
compatibility_date = "2026-08-30"
keep_vars = true

[vars]
TEAM_DOMAIN = "https://calm-salad-ca7e.cloudflareaccess.com"
POLICY_AUD = "366f84d7f9485d0a12cfe8fe7835ca7276614da855e1a18ae426f67b9c77cc29"

[assets]
directory = "./public"
binding = "ASSETS"
# HTML pages go through the Worker so they get the security headers (CSP, frame-ancestors, nosniff…).
run_worker_first = ["/admin/*", "/api/*", "/telegram/*", "/hub", "/hub.html", "/", "/index.html", "/characters", "/characters.html"]

[images]
binding = "IMAGES"

[[d1_databases]]
binding = "DB"
database_name = "archive-characters"
database_id = "acc550d1-66d7-416e-b1af-73ca22f7c230"

[[r2_buckets]]
binding = "HUB_FILES"
bucket_name = "archive-exe-hub-files"
