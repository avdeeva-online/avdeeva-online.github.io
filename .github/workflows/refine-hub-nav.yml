name: Refine TAVO Hub navigation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/refine-hub-nav.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine hub navigation and labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/hub.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<kbd>CTRL+K</kbd>','')
          old='<nav class="side-nav"><button class="side-link active"><span class="folder"></span><span>ALL RESOURCES</span><span class="count">(42)</span></button><button class="side-link"><span class="folder"></span><span>PRESETS</span><span class="count">(8)</span></button><button class="side-link"><span class="folder"></span><span>CREATORS</span><span class="count">(3)</span></button><button class="side-link"><span class="folder"></span><span>PLUGINS</span><span class="count">(6)</span></button><button class="side-link"><span class="folder"></span><span>THEMES</span><span class="count">(7)</span></button><button class="side-link"><span class="folder"></span><span>GUIDES</span><span class="count">(9)</span></button><button class="side-link"><span class="folder"></span><span>LINKS</span><span class="count">(6)</span></button><button class="side-link"><span class="folder"></span><span>TOOLS</span><span class="count">(6)</span></button></nav>'
          new='<nav class="side-nav"><button class="side-link active"><span class="nav-icon">▦</span><span>ALL RESOURCES</span><span class="count">(42)</span></button><button class="side-link"><span class="nav-icon">✦</span><span>PRESETS</span><span class="count">(8)</span></button><button class="side-link"><span class="nav-icon">◎</span><span>CREATORS</span><span class="count">(3)</span></button><button class="side-link"><span class="nav-icon">⧉</span><span>PLUGINS</span><span class="count">(6)</span></button><button class="side-link"><span class="nav-icon">◐</span><span>THEMES</span><span class="count">(7)</span></button><button class="side-link"><span class="nav-icon">≡</span><span>GUIDES</span><span class="count">(9)</span></button><button class="side-link"><span class="nav-icon">↗</span><span>LINKS</span><span class="count">(6)</span></button><button class="side-link"><span class="nav-icon">⚙︎</span><span>TOOLS</span><span class="count">(6)</span></button></nav>'
          if old not in s: raise SystemExit('nav target not found')
          s=s.replace(old,new,1)
          s=s.replace('<div class="toolbar-left">&gt; 8 RESOURCES FOUND</div>','<div class="toolbar-left">8 ENTRIES</div>',1)
          s=s.replace("found.textContent=`> ${n} RESOURCES FOUND`","found.textContent=`${n} ENTRIES`",1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "archive-exe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/hub.html
          git diff --cached --quiet && exit 0
          git commit -m "Refine TAVO Hub navigation"
          git push
