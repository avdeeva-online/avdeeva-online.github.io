name: Refine TAVO Hub UI

on:
  push:
    paths:
      - '.github/workflows/refine-hub-ui.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refine hub layout and interactions
        env:
          HUB_CSS_B64: "      fS5kaXJlY3Rvcnk6YmVmb3JlLC5kaXJlY3Rvcnk6YWZ0ZXJ7d2lkdGg6NDIlO2hlaWdodDo1NHB4O29wYWNpdHk6LjE3fS5odWItdGl0bGUgaDF7Zm9udC1zaXplOjI2cHh9LnNpZGUtbmF2e2dyaWQtdGVtcGxhdGUtY29sdW1zOnJlcGVhdCgyLG1pbm1heCgwLDFmcikpfS5yZXNvdXJjZS1ncmlke2dyaWQtdGVtcGxhdGUtY29sdW1zOjFmcj t9LnJlc291cmNlLWdyaWQubGlzdC12aWV3IC5yZXNvdXJjZS1jYXJke2Rpc3BsYXk6YmxvY2t9LnJlc291cmNlLWdyaWQubGlzdC12aWV3IC50aHVtYntoZWlnaHQ6OTZweDtib3JkZXItcmlnaHQ6MDtib3JkZXItYm90dG9tOjFweCBzb2xpZCByZ2JhKDExNywxMzIsMTA1LC4yMil9fQo="
          HUB_JS_B64: "CiAgPHNjcmlwdD4KICAgIC8vIEhVQi1WSUVXLVRPR0dMRQogICAgKCgpPT57CiAgICAgIGNvbnN0IGdyaWQ9ZG9jdW1lbnQucXVlcnlTZWxlY3RvcignLnJlc291cmNlLWdyaWQnKTsKICAgICAgY29uc3QgdG9nZ2xlcz1bLi4uZG9jdW1lbnQucXVlcnlTZWxlY3RvckFsbCgnLnZpZXctYnRuJyldOwogICAgICBpZighZ3JpZHx8dG9nZ2xlcy5sZW5ndGg8Mil yZXR1cm47CiAgICAgIHRvZ2dsZXMuZm9yRWFjaCgoYnRuLGkpPT5idG4uYWRkRXZlbnRMaXN0ZW5lcignY2xpY2snLCgpPT57CiAgICAgICAgdG9nZ2xlcy5mb3JFYWNoKGI9PmIuY2xhc3NMaXN0LnJlbW92ZSgnYWN0aXZlJykpOwogICAgICAgIGJ0bi5jbGFzc0xpc3QuYWRkKCdhY3RpdmUnKTsKICAgICAgICBncmlkLmNsYXNzTGlzdC50b2dnbGUoJ2xpc3Qtdmlldycs aT09PTEpOwogICAgICB9KSk7CiAgICB9KSgpOwogIDwvc2NyaXB0Pgo="
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, base64
          p = Path('public/hub.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* HUB-REFINE-2026-09-13 */'
          if marker not in s:
              css = base64.b64decode(os.environ['HUB_CSS_B64']).decode('utf-8')
              s = s.replace('  </style>', css + '\n  </style>', 1)
          s = s.replace('FIND TOOLS.<br>FUEL IMAGINATION.<br>BUILD BRIGHTER WORLDS.', '')
          if '// HUB-VIEW-TOGGLE' not in s:
              extra = base64.b64decode(os.environ['HUB_JS_B64']).decode('utf-8')
              s = s.replace('</body>', extra + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit refinement
        run: |
          git config user.name "archive-exe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/hub.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Refine TAVO Hub layout and UX"
          git push
