name: Apply TAVO Hub SVG icons
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-hub-svg-icons.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace nav markers with SVG icon set
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/hub.html')
          s=p.read_text(encoding='utf-8')
          icons={
          '00':'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/></svg>',
          '01':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h8M16 7h4M12 4v6M4 17h4M12 17h8M8 14v6"/></svg>',
          '02':'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="2"/><circle cx="9" cy="11" r="2.5"/><path d="M5.8 16c.9-1.7 2-2.5 3.2-2.5s2.3.8 3.2 2.5M14.5 10h3.5M14.5 14h3.5"/></svg>',
          '03':'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="7" width="7" height="10" rx="1"/><rect x="13" y="7" width="7" height="10" rx="1"/><path d="M11 10h2M11 14h2M7.5 4v3M16.5 17v3"/></svg>',
          '04':'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z"/></svg>',
          '05':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5c2.8 0 5.2.5 8 2.2v11c-2.8-1.7-5.2-2.2-8-2.2zM20 5.5c-2.8 0-5.2.5-8 2.2v11c2.8-1.7 5.2-2.2 8-2.2z"/></svg>',
          '06':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 14.5l-2 2a3.5 3.5 0 1 1-5-5l3-3a3.5 3.5 0 0 1 5 0M14.5 9.5l2-2a3.5 3.5 0 1 1 5 5l-3 3a3.5 3.5 0 0 1-5 0M8.5 15.5l7-7"/></svg>',
          '07':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5a4 4 0 0 0-5 5L4 16l4 4 5.5-5.5a4 4 0 0 0 5-5l-3 3-4-4z"/></svg>'
          }
          for n,svg in icons.items():
              s=s.replace(f'<span class="nav-icon">{n}</span>', f'<span class="nav-icon">{svg}</span>')
          p.write_text(s,encoding='utf-8')

          c=Path('public/hub-polish.css')
          css=c.read_text(encoding='utf-8')
          start=css.find('.nav-icon{')
          end=css.find('\n.folder{', start)
          if start!=-1 and end!=-1:
              new='''.nav-icon{width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;color:#9f8d61;opacity:.76;transition:color .15s,opacity .15s,transform .15s}.nav-icon svg{width:17px;height:17px;display:block;fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}.side-link:hover .nav-icon{color:#b7a574;opacity:.92}.side-link.active .nav-icon{color:#d8c797;opacity:1;transform:translateX(1px)}'''
              css=css[:start]+new+css[end:]
          css=css.replace('grid-template-columns:30px minmax(0,1fr) auto','grid-template-columns:24px minmax(0,1fr) auto')
          c.write_text(css,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "archive-exe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/hub.html public/hub-polish.css
          git diff --cached --quiet && exit 0
          git commit -m "Use unified SVG icons in TAVO Hub navigation"
          git push
