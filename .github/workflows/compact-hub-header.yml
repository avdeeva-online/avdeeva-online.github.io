name: Compact TAVO Hub header
on:
  push:
    paths:
      - '.github/workflows/compact-hub-header.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compact header and shorten copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/hub.html')
          s = p.read_text()
          old = 'Presets, plugins, guides, themes, links, tools and other useful resources for TAVO. Browse. Explore. Create.'
          new = 'Presets, plugins, themes, guides and tools for TAVO.'
          if old in s:
              s = s.replace(old, new)
          p.write_text(s)
          PY
          cat >> public/hub-polish.css <<'CSS'

/* TAVO HUB — compact header pass */
.directory-head{grid-template-columns:170px minmax(0,1fr);padding:9px 13px 9px;gap:12px;align-items:center}
.hub-title{align-self:center}
.hub-title h1{font-size:25px;line-height:.96;letter-spacing:.012em}
.hub-title .sub{margin-top:4px;font-size:6.8px;letter-spacing:.13em}
.hub-title .desc{margin-top:6px;max-width:170px;font-size:7px;line-height:1.28;color:#929c93}
.search-wrap{align-self:center}
.search{height:34px;padding:0 12px}
.search svg{width:15px;height:15px;flex:0 0 15px}
.search input{font-size:8.2px}
@media(min-width:1450px){.directory-head{grid-template-columns:170px minmax(0,1fr)}}
@media(max-width:1180px){.directory-head{grid-template-columns:175px minmax(0,1fr)}}
@media(max-width:860px){.directory-head{grid-template-columns:1fr;padding:11px 12px 10px;gap:9px}.hub-title .desc{max-width:360px}.search{height:35px}}
CSS
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/hub.html public/hub-polish.css
          git commit -m "Compact TAVO Hub header" || exit 0
          git push
# triggered manually by repository update
