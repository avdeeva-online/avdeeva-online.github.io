name: Tune Hub description layout
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tune-hub-description-layout.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Widen and left-align modal description
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/hub-dynamic.js')
          s=p.read_text()
          old=".hub-modal-desc{white-space:pre-wrap;font:10.9px/1.66 var(--mono);color:#c9cec6;letter-spacing:.004em;margin:16px auto 0;max-width:58ch}"
          new=".hub-modal-desc{white-space:pre-wrap;font:10.8px/1.60 var(--mono);color:#c9cec6;letter-spacing:.003em;margin:16px 0 0;max-width:72ch;padding-right:5%}"
          if old not in s:
              raise SystemExit('target description style not found')
          s=s.replace(old,new,1)
          old2=".hub-extra-text{white-space:pre-wrap;font:10.4px/1.58 var(--mono);color:#c6ccc2;letter-spacing:.005em;margin:14px auto 0;max-width:58ch;padding:11px 12px;"
          new2=".hub-extra-text{white-space:pre-wrap;font:10.4px/1.58 var(--mono);color:#c6ccc2;letter-spacing:.005em;margin:14px 0 0;max-width:72ch;padding:11px 12px;"
          if old2 in s:
              s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/hub-dynamic.js
          git diff --cached --quiet && exit 0
          git commit -m 'Refine TAVO Hub description layout'
          git push origin main
