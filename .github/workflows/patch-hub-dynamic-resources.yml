name: Patch TAVO Hub dynamic resources
on:
  push:
    paths:
      - '.github/workflows/patch-hub-dynamic-resources.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch hub.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/hub.html')
          s=p.read_text()
          old='<script>\n(()=>{const side='
          new='<script src="hub-dynamic.js?v=1"></script>\n<script>\n(async()=>{await (window.__hubResourcesReady||Promise.resolve());const side='
          if new in s:
              print('already patched')
          elif old in s:
              s=s.replace(old,new,1)
              p.write_text(s)
              print('patched')
          else:
              raise SystemExit('target not found')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/hub.html
          git diff --cached --quiet || git commit -m "Render published TAVO Hub resources on public page"
          git push
