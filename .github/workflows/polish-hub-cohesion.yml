name: Polish TAVO Hub cohesion

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/polish-hub-cohesion.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Link cohesion stylesheet
        run: python -c "from pathlib import Path; p=Path('public/hub.html'); s=p.read_text(encoding='utf-8'); s=s if 'hub-polish.css' in s else s.replace('</head>','<link rel=\"stylesheet\" href=\"hub-polish.css?v=1\">\\n</head>',1); p.write_text(s,encoding='utf-8')"
      - name: Commit changes
        run: |
          git config user.name "archive-exe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/hub.html
          git diff --cached --quiet && exit 0
          git commit -m "Polish TAVO Hub visual cohesion"
          git push
