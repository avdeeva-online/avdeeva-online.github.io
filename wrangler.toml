name = "archive-exe"
main = "src/cloudflare-entry-v2.js"
compatibility_date = "2026-08-30"
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/admin/*", "/api/*", "/telegram/*", "/hub", "/hub.html"]

[[d1_databases]]
binding = "DB"
database_name = "archive-characters"
database_id = "acc550d1-66d7-416e-b1af-73ca22f7c230"

# Wrangler 4 can auto-provision an R2 bucket for this binding on deploy.
# HUB uploads use R2 when this binding is present and transparently fall back to D1 otherwise.
[[r2_buckets]]
binding = "HUB_FILES"
