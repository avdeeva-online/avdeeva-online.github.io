name: Optimize gateway assets

on:
  push:
    paths:
      - '.github/workflows/optimize-gateway-assets.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install WebP tools
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: Convert gateway ivy PNGs to WebP
        run: |
          set -euo pipefail
          for name in ivytop1 ivytop2 ivysidetopleft ivysideright ivybottom; do
            cwebp -quiet -q 88 -alpha_q 100 -m 6 "public/assets/${name}.png" -o "public/assets/${name}.webp"
          done

      - name: Switch gateway to optimized assets
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/index.html')
          s = p.read_text(encoding='utf-8')
          for name in ['ivytop1','ivytop2','ivysidetopleft','ivysideright','ivybottom']:
              s = s.replace(f"assets/{name}.png", f"assets/{name}.webp")
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit optimized assets
        run: |
          git config user.name "archive-exe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/index.html public/assets/*.webp
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Optimize gateway ivy assets"
          git push

# Trigger optimization after workflow registration.
