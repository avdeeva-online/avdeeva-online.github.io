<!doctype html><html lang="en"><head><link rel="icon" href="/favicon.svg" type="image/svg+xml"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta http-equiv="Cache-Control" content="no-store"><title>ARCHIVE.EXE / SUGGESTIONS</title><style>:root{--bg:#0b0e0b;--panel:#11150f;--line:#2f382b;--text:#cbd4c2;--muted:#6f7a69;--ok:#90a884;--warn:#c6ad73;--bad:#b58a78;--mono:Consolas,ui-monospace,monospace}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 30% 0,#161d14 0,#0b0e0b 42%);color:var(--text);font-family:var(--mono)}a{color:inherit}.shell{width:min(1180px,calc(100% - 28px));margin:28px auto 60px}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-bottom:16px;border-bottom:1px solid var(--line)}.eyebrow{font-size:9px;letter-spacing:.12em;color:var(--muted)}h1{margin:7px 0 0;font-size:25px}.btn{border:1px solid var(--line);background:#10140e;color:#aeb9a5;padding:9px 12px;font:9px var(--mono);cursor:pointer;text-decoration:none}.btn.primary{background:#20281c;color:#e0e6d7;border-color:#59684f}.btn.danger{border-color:#68463e;color:#d2a091}.panel{border:1px solid var(--line);background:rgba(17,21,15,.92);padding:13px;margin-bottom:12px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.status{margin-top:9px;padding:9px;border-left:2px solid #475141;background:#0c100b;color:#899583;font-size:8px}.list{display:grid;gap:8px}.item{border:1px solid rgba(72,85,66,.55);background:#0c100b;padding:12px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.url{font-size:10px;word-break:break-all;color:#d9dfd2}.meta{margin-top:5px;color:var(--muted);font-size:7.5px}.note{margin-top:9px;padding:9px;border-left:1px solid rgba(143,157,126,.25);color:#aab3a7;font-size:8.5px;line-height:1.5;white-space:pre-wrap}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.pill{border:1px solid #3a4535;padding:4px 6px;font-size:7px;text-transform:uppercase;color:#8f9b8a}.pill.new{color:#e5d29c;border-color:#6d6543}.pill.reviewing{color:#9eb8c8;border-color:#435967}.pill.added{color:#a9c09d;border-color:#4d6548}.pill.ignored{color:#8d8d86}.empty{padding:30px;text-align:center;color:#687364;font-size:9px;border:1px dashed #303a2c}@media(max-width:700px){.head{align-items:flex-start;flex-direction:column}.top{flex-direction:column}}</style></head><body><main class="shell"><header class="head"><div><div class="eyebrow">PRIVATE TOOL / TAVO HUB</div><h1>SUGGESTIONS</h1></div><div class="eyebrow">PUBLIC SUBMISSIONS → RESOURCE IMPORT</div></header><section class="panel"><div class="toolbar"><button class="btn primary" data-filter="new">NEW</button><button class="btn" data-filter="reviewing">REVIEWING</button><button class="btn" data-filter="added">ADDED</button><button class="btn" data-filter="ignored">IGNORED</button><button class="btn" data-filter="all">ALL</button><button class="btn" id="reload">RELOAD</button></div><div id="status" class="status">LOADING...</div></section><section class="panel"><div id="list" class="list"></div></section></main><script>
(()=>{const $=s=>document.querySelector(s),list=$('#list'),status=$('#status');let filter='new',rows=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const date=v=>{try{return new Date(String(v).replace(' ','T')+'Z').toLocaleString()}catch{return v||''}};
function render(){const shown=filter==='all'?rows:rows.filter(x=>x.status===filter);if(!shown.length){list.innerHTML='<div class="empty">NO SUGGESTIONS IN THIS QUEUE</div>';return}list.innerHTML=shown.map(x=>`<article class="item" data-id="${x.id}"><div class="top"><div><a class="url" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.url)}</a><div class="meta">${date(x.created_at)} · ID ${x.id}</div></div><span class="pill ${esc(x.status)}">${esc(x.status)}</span></div>${x.note?`<div class="note">${esc(x.note)}</div>`:''}<div class="actions"><a class="btn primary" data-import="1" href="/admin/hub/?source=${encodeURIComponent(x.url)}">OPEN IN RESOURCE IMPORT</a><button class="btn" data-status="reviewing">REVIEWING</button><button class="btn" data-status="added">ADDED</button><button class="btn" data-status="ignored">IGNORE</button><button class="btn danger" data-delete="1">DELETE</button></div></article>`).join('')}
async function load(){status.textContent='LOADING...';try{const r=await fetch('/api/admin/hub-suggestions',{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||`HTTP_${r.status}`);rows=d.suggestions||[];status.textContent=`READY · ${rows.filter(x=>x.status==='new').length} NEW · ${rows.length} TOTAL`;render()}catch(e){status.textContent='LOAD FAILED: '+e.message;list.innerHTML='<div class="empty">SUGGESTION QUEUE UNAVAILABLE</div>'}}
async function change(id,newStatus){const r=await fetch('/api/admin/hub-suggestions/'+id,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({status:newStatus})}),d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||`HTTP_${r.status}`);const row=rows.find(x=>String(x.id)===String(id));if(row)row.status=newStatus;render()}
list.addEventListener('click',async e=>{const item=e.target.closest('.item');if(!item)return;const id=item.dataset.id;if(e.target.closest('[data-import]')){try{await change(id,'reviewing')}catch{}return}try{if(e.target.dataset.status)await change(id,e.target.dataset.status);else if(e.target.dataset.delete){if(!confirm('Delete this suggestion?'))return;const r=await fetch('/api/admin/hub-suggestions/'+id,{method:'DELETE'}),d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||`HTTP_${r.status}`);rows=rows.filter(x=>String(x.id)!==String(id));render()}}catch(err){status.textContent='ACTION FAILED: '+err.message}});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('primary',x===b));render()});$('#reload').onclick=load;load()})();
</script></body></html>
