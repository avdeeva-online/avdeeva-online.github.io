<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta http-equiv="Cache-Control" content="no-store">
<title>ARCHIVE.EXE / HUB DRAFTS</title>
<style>
:root{--bg:#0b0e0b;--panel:#11150f;--panel2:#0d110c;--line:#2f382b;--text:#cbd4c2;--muted:#6f7a69;--accent:#d1bd87;--ok:#9eb58f;--bad:#c08d7c;--mono:Consolas,ui-monospace,monospace}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 30% 0,#161d14 0,#0b0e0b 42%);color:var(--text);font-family:var(--mono)}.shell{width:min(1200px,calc(100% - 28px));margin:26px auto 70px}.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;padding-bottom:16px;border-bottom:1px solid var(--line)}.eyebrow{font-size:8px;letter-spacing:.14em;color:var(--muted)}h1{margin:7px 0 0;font-size:26px}.back{border:1px solid var(--line);color:#abb5a4;text-decoration:none;padding:8px 10px;font-size:8px}.layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:12px;margin-top:14px}.panel{border:1px solid var(--line);background:rgba(17,21,15,.9);padding:14px}.list{display:grid;gap:7px}.draft{width:100%;text-align:left;border:1px solid #303a2c;background:#0d110c;color:#c7d0bf;padding:10px;cursor:pointer}.draft.active{border-color:#756d4a;background:#171a11}.draft b{display:block;font-size:10px}.draft span{display:block;margin-top:5px;color:var(--muted);font-size:7.5px;line-height:1.4}.empty{padding:24px 8px;text-align:center;color:var(--muted);font-size:8px}.fields{display:grid;gap:10px}.field label{display:block;margin-bottom:5px;color:#7f8a79;font-size:8px;letter-spacing:.08em}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,textarea,select{width:100%;background:#0b0f0a;border:1px solid #34402f;color:#d5dccd;padding:10px 11px;font:10px var(--mono);outline:none}textarea{min-height:90px;resize:vertical}.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{border:1px solid #34402f;background:#0f140e;color:#899687;padding:6px 8px;font:8px var(--mono);cursor:pointer}.chip.active{border-color:#776f4c;color:#eadfbd;background:#191b12}.meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.meta div{border:1px solid #2b3428;background:#0b0f0a;padding:8px}.meta b{display:block;font-size:10px;color:#ddd5bd}.meta span{display:block;margin-top:4px;font-size:7px;color:var(--muted)}.source-list,.file-list{display:grid;gap:5px}.source-row,.file-row{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid #2c3629;background:#0a0e09;padding:8px;font-size:8px}.source-row a{color:#b8c2b0;text-decoration:none;word-break:break-all}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.btn{border:1px solid #4a5644;background:#10140e;color:#c6cfbe;padding:9px 12px;font:9px var(--mono);cursor:pointer}.btn.primary{border-color:#756d4a;color:#eadfbd;background:#1b1d13}.btn.danger{border-color:#67483e;color:#c89a8a}.status{margin-top:10px;min-height:34px;padding:9px;border-left:2px solid #475141;background:#0b0f0a;color:#899583;font-size:8px;white-space:pre-wrap}.status.ok{border-color:#5d744f;color:#a8bd99}.status.bad{border-color:#744d42;color:#c49382}@media(max-width:820px){.layout{grid-template-columns:1fr}.field-grid,.meta{grid-template-columns:1fr 1fr}}@media(max-width:520px){.shell{width:calc(100% - 16px);margin-top:14px}.field-grid,.meta{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<main class="shell">
<header class="head"><div><div class="eyebrow">PRIVATE TOOL / TAVO HUB</div><h1>HUB DRAFTS</h1></div><a class="back" href="/admin/">← ADMIN</a></header>
<div class="layout">
  <section class="panel"><div class="eyebrow" style="margin-bottom:10px">TELEGRAM IMPORT QUEUE</div><div id="list" class="list"><div class="empty">LOADING…</div></div></section>
  <section class="panel"><div id="empty" class="empty">SELECT A DRAFT</div><div id="editor" hidden>
    <div class="meta"><div><b id="mPosts">0</b><span>SOURCE POSTS</span></div><div><b id="mMedia">0</b><span>MEDIA</span></div><div><b id="mFiles">0</b><span>FILES</span></div><div><b id="mUpdated">—</b><span>UPDATED</span></div></div>
    <div class="fields" style="margin-top:12px">
      <div class="field"><label>TITLE</label><input id="title"></div>
      <div class="field-grid"><div class="field"><label>TYPE</label><select id="type"><option>preset</option><option>plugin</option><option>theme</option><option>guide</option><option>tool</option><option>link</option><option>asset</option><option>other</option></select></div><div class="field"><label>AUTHOR</label><input id="creator"></div></div>
      <div class="field"><label>AUTHOR LINK</label><input id="creatorLink"></div>
      <div class="field"><label>MODELS</label><div id="models" class="chips"></div></div>
      <div class="field"><label>SETTINGS</label><div id="settings" class="chips"></div></div>
      <div class="field"><label>TAGS — comma separated</label><input id="tags"></div>
      <div class="field"><label>SHORT DESCRIPTION</label><textarea id="short"></textarea></div>
      <div class="field"><label>FULL DESCRIPTION</label><textarea id="full" style="min-height:150px"></textarea></div>
      <div class="field"><label>SOURCE POSTS</label><div id="sources" class="source-list"></div></div>
      <div class="field"><label>FILES</label><div id="files" class="file-list"></div></div>
    </div>
    <div class="toolbar"><button class="btn" id="save">SAVE DRAFT</button><button class="btn primary" id="publish">PUBLISH</button><button class="btn danger" id="delete">DELETE</button></div>
    <div id="status" class="status">READY.</div>
  </div></section>
</div>
</main>
<script>
(()=>{
const $=s=>document.querySelector(s), modelVals=['gemini','claude','gpt','deepseek','other'], settingVals=['modern','fantasy','medieval','post-apocalypse','sci-fi','omegaverse','rusreal'];let rows=[],current=null,selectedModels=new Set(),selectedSettings=new Set();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function chips(box,vals,set){box.innerHTML=vals.map(v=>`<button type="button" class="chip ${set.has(v)?'active':''}" data-v="${v}">${v.toUpperCase()}</button>`).join('');box.onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const v=b.dataset.v;set.has(v)?set.delete(v):set.add(v);b.classList.toggle('active',set.has(v))}}
function setStatus(t,kind=''){const s=$('#status');s.className='status '+kind;s.textContent=t}
async function loadList(){const r=await fetch('/api/admin/telegram-drafts',{cache:'no-store'}),d=await r.json();rows=d.drafts||[];$('#list').innerHTML=rows.length?rows.map(x=>`<button class="draft ${current===x.id?'active':''}" data-id="${x.id}"><b>${esc(x.title)}</b><span>${esc(x.type.toUpperCase())} · @${esc(x.creator||'—')} · ${x.source_posts} POSTS · ${x.file_count} FILES</span></button>`).join(''):'<div class="empty">NO DRAFTS</div>';$('#list').onclick=e=>{const b=e.target.closest('.draft');if(b)openDraft(b.dataset.id)}}
async function openDraft(id){const r=await fetch('/api/admin/telegram-drafts/'+encodeURIComponent(id),{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)return;current=id;const x=d.draft,a=x.analysis||{},dr=a.draft||{};$('#empty').hidden=true;$('#editor').hidden=false;$('#title').value=dr.title||'';$('#type').value=dr.type||'other';$('#creator').value=dr.creator||a.source?.channel||'';$('#creatorLink').value=dr.creatorLink||'';$('#short').value=dr.descriptionShort||'';$('#full').value=dr.descriptionFull||a.source?.rawText||'';$('#tags').value=(dr.tags||[]).join(', ');selectedModels=new Set(dr.models||[]);selectedSettings=new Set(dr.settings||[]);chips($('#models'),modelVals,selectedModels);chips($('#settings'),settingVals,selectedSettings);const posts=(a.sourcePosts&&a.sourcePosts.length?a.sourcePosts:[{url:a.source?.url||x.source_url}]);$('#mPosts').textContent=posts.length;$('#mMedia').textContent=(a.media||[]).length;$('#mFiles').textContent=(a.files||[]).length;$('#mUpdated').textContent=(x.updated_at||'').replace('T',' ').slice(0,16)||'—';$('#sources').innerHTML=posts.map((p,i)=>`<div class="source-row"><span>#${i+1}</span><a target="_blank" rel="noopener" href="${esc(p.url)}">${esc(p.url)}</a></div>`).join('');$('#files').innerHTML=(a.files||[]).length?(a.files||[]).map(f=>`<div class="file-row"><span>${esc(f.name||'telegram-file')}</span><span>${f.size?Math.round(f.size/1024)+' KB':(f.telegram_file_id?'TELEGRAM':'REMOTE')}</span></div>`).join(''):'<div class="empty">NO FILES</div>';setStatus('READY.');await loadList()}
function payload(){return{title:$('#title').value,type:$('#type').value,creator:$('#creator').value,creatorLink:$('#creatorLink').value,descriptionShort:$('#short').value,descriptionFull:$('#full').value,models:[...selectedModels],settings:[...selectedSettings],tags:$('#tags').value.split(',').map(x=>x.trim()).filter(Boolean)}}
$('#save').onclick=async()=>{if(!current)return;setStatus('SAVING…');const r=await fetch('/api/admin/telegram-drafts/'+encodeURIComponent(current),{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify(payload())}),d=await r.json();if(r.ok&&d.ok){setStatus('DRAFT SAVED.','ok');await loadList()}else setStatus('SAVE FAILED: '+(d.error||r.status),'bad')};
$('#publish').onclick=async()=>{if(!current)return;if(!confirm('Publish this resource to TAVO HUB?'))return;setStatus('PUBLISHING… Telegram files may take a moment.');const r=await fetch('/api/admin/telegram-drafts/'+encodeURIComponent(current)+'/publish',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload())}),d=await r.json();if(r.ok&&d.ok){setStatus('PUBLISHED ✓','ok');current=null;$('#editor').hidden=true;$('#empty').hidden=false;await loadList()}else setStatus('PUBLISH FAILED: '+(d.detail||d.error||r.status),'bad')};
$('#delete').onclick=async()=>{if(!current||!confirm('Delete this draft?'))return;const r=await fetch('/api/admin/telegram-drafts/'+encodeURIComponent(current),{method:'DELETE'}),d=await r.json();if(r.ok&&d.ok){current=null;$('#editor').hidden=true;$('#empty').hidden=false;await loadList()}else setStatus('DELETE FAILED','bad')};
loadList().catch(e=>$('#list').innerHTML='<div class="empty">FAILED: '+esc(e.message)+'</div>');
})();
</script>
</body>
</html>
