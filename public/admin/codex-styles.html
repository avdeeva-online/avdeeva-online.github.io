<!doctype html><html lang="ru"><head><link rel="icon" href="/favicon.svg" type="image/svg+xml"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta http-equiv="Cache-Control" content="no-store"><title>Стили · ARCHIVE ADMIN</title>
<style>
:root{--bg:#0b0e0b;--line:#2f382b;--text:#cbd4c2;--muted:#6f7a69;--sand:#cdb88a;--mono:Consolas,ui-monospace,monospace}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 30% 0,#161d14 0,#0b0e0b 42%);color:var(--text);font-family:var(--mono)}
.shell{width:min(1180px,calc(100% - 28px));margin:28px auto 60px}.head{padding-bottom:14px;border-bottom:1px solid var(--line)}h1{margin:7px 0 0;font-size:25px}
.grid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:12px;margin-top:14px;align-items:start}
.panel{border:1px solid var(--line);background:rgba(17,21,15,.92);padding:13px}
.btn{border:1px solid var(--line);background:#10140e;color:#aeb9a5;padding:8px 12px;font:11px var(--mono);cursor:pointer;border-radius:4px}
.btn.primary{background:#262618;color:#efe4bd;border-color:#8f8558}.btn.danger{border-color:#68463e;color:#d2a091}.btn.small{padding:4px 8px;font-size:11px}
.list{display:grid;gap:4px;max-height:66vh;overflow:auto;margin-top:10px}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px;border:1px solid transparent;border-radius:5px;cursor:pointer}
.row:hover{background:#141911}.row.active{border-color:#8f8558;background:#1c2016}
.row img,.row i{width:44px;height:44px;border-radius:4px;object-fit:cover;background:#151814;border:1px solid var(--line);display:block}
.row b{display:block;font-size:12px;color:#e6e0d2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row small{color:var(--muted);font-size:10.5px}
.row .moves{display:flex;flex-direction:column;gap:2px}
label{display:block;margin:13px 0 5px;color:var(--muted);font-size:11px}
input,textarea{width:100%;border:1px solid var(--line);background:#0c100b;color:var(--text);font:13px/1.5 var(--mono);padding:8px 9px}
textarea{min-height:130px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pic{display:grid;grid-template-columns:180px minmax(0,1fr);gap:12px;align-items:start}
.pic .preview{width:180px;aspect-ratio:4/5;border:1px dashed #465440;background:#080b08 center/cover no-repeat;display:grid;place-items:center;color:#657060;font-size:11px;text-align:center;padding:8px}
.hint{color:var(--muted);font-size:11px;line-height:1.5;margin-top:5px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.status{margin-top:10px;font-size:11px;color:#899583}.status.bad{color:#d2a091}.status.ok{color:#cdb88a}
.empty{padding:30px 10px;text-align:center;color:var(--muted);font-size:12px}
.import{padding:0 0 14px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.import-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.post-pics{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.post-pics button{padding:0;width:92px;aspect-ratio:4/5;border:2px solid transparent;border-radius:6px;background:#151814 center/cover no-repeat;cursor:pointer}
.post-pics button.active{border-color:#cdb88a}
.post-pics button:hover{border-color:#8f8558}
.model-pick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}.model-pick label{display:flex;align-items:center;gap:5px;margin:0;padding:5px 9px;border:1px solid #2f382b;border-radius:999px;color:#cbd4c2;font-size:12px;cursor:pointer}.model-pick label:has(input:checked){border-color:#8f8558;background:#262618;color:#efe4bd}.model-pick input{accent-color:#cdb88a}
.gallery{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}.gallery:empty::before{content:'Картинок нет';color:#6f7a69;font-size:12px}
.gallery .g{position:relative;width:96px;aspect-ratio:4/5;border:1px solid #2f382b;border-radius:6px;background:#151814 center/cover no-repeat}
.gallery .g:first-child{outline:2px solid #cdb88a;outline-offset:1px}.gallery .g:first-child::after{content:'обложка';position:absolute;left:4px;top:4px;padding:1px 5px;border-radius:4px;background:#cdb88a;color:#14120c;font-size:9px}
.gallery .g-tools{position:absolute;left:3px;right:3px;bottom:3px;display:flex;justify-content:space-between}.gallery .g-tools button{width:24px;height:22px;padding:0;border:1px solid #3d4938;border-radius:4px;background:rgba(10,13,10,.88);color:#e6e0d2;font-size:11px;cursor:pointer}
@media(max-width:800px){.grid{grid-template-columns:1fr}.list{max-height:36vh}.two,.pic{grid-template-columns:1fr}.pic .preview{width:150px}}
</style></head><body><main class="shell">
<header class="head"><h1>Стили</h1></header>
<div class="grid">
  <section class="panel"><button class="btn primary" id="new" type="button">+ Новый стиль</button><div id="list" class="list"><div class="empty">Загрузка…</div></div></section>
  <section class="panel">
    <div class="import">
      <label style="margin-top:0">Импорт из поста Telegram</label>
      <div class="import-row"><input id="postUrl" placeholder="https://t.me/канал/123"><button class="btn primary" id="analyze" type="button">Разобрать пост</button></div>
      <div class="hint">Заполнит название, текст, автора и ссылку и добавит картинки из поста в обложки (нажатие на картинку поста — убрать / вернуть). Потом проверь поля и нажми «Сохранить».</div>
      <div id="postPics" class="post-pics" hidden></div>
    </div>
    <form id="form" autocomplete="off">
      <label style="margin-top:0">Картинки (до 8) — первая будет обложкой, на сайте листаются</label><div id="gallery" class="gallery"></div><input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden><button class="btn" id="pick" type="button">+ Добавить картинки</button><div class="hint">JPG / PNG / WEBP, сжимаются автоматически. ← → меняют порядок, ✕ убирает.</div>
      <label>Название</label><input id="title" maxlength="120" placeholder="Dressy Shorts">
      <div class="two"><div><label>Модели — можно несколько</label><div id="modelPick" class="model-pick"></div><input id="modelOther" maxlength="40" placeholder="другая модель (через запятую)"></div>
      <div><label>Автор стиля (необязательно)</label><input id="author" maxlength="80" placeholder="ник"></div></div>
      <div class="two"><div><label>Ссылка на автора (необязательно)</label><input id="authorLink" placeholder="https://t.me/канал"></div>
      <div><label>Ссылка на пост со стилем (необязательно)</label><input id="sourceUrl" placeholder="https://t.me/канал/123"></div></div>
      <label>Текст стиля — копируется на сайте одним нажатием</label><textarea id="prompt" placeholder="clothes: tailored pinstripe bermuda shorts, …"></textarea>
      <div class="actions"><button class="btn primary" type="submit" id="save">Сохранить</button><button class="btn danger" type="button" id="del" hidden>Удалить стиль</button><a class="btn" href="/codex.html#tab=styles" target="_blank" rel="noopener">Открыть на сайте ↗</a></div>
      <div class="status" id="st"></div>
    </form>
  </section>
</div>
</main>
<script>
(()=>{
  const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let styles=[],current=null,gallery=[];/* gallery items: {key,url} kept · {data} uploaded · {url,post:true} from a Telegram post */
  const MAX=8;
  // Model checkboxes: the usual ones plus every model already used by some style.
  const BASE_MODELS=['NovelAI v4.5','NovelAI v5','Nano Banana'];
  const allModels=()=>{const seen=new Set(),out=[];for(const m of [...BASE_MODELS,...styles.flatMap(s=>s.models||String(s.model||'').split(',').map(x=>x.trim()))]){const k=String(m||'').toLowerCase();if(m&&!seen.has(k)){seen.add(k);out.push(m)}}return out};
  function renderModels(selected){const sel=new Set(selected.map(m=>m.toLowerCase()));$('#modelPick').innerHTML=allModels().map(m=>`<label><input type="checkbox" value="${esc(m)}" ${sel.has(m.toLowerCase())?'checked':''}>${esc(m)}</label>`).join('');$('#modelOther').value=''}
  const pickedModels=()=>[...document.querySelectorAll('#modelPick input:checked')].map(i=>i.value).concat($('#modelOther').value.split(',').map(x=>x.trim()).filter(Boolean));
  const thumb=g=>g.data||g.url;
  function renderGallery(){$('#gallery').innerHTML=gallery.map((g,i)=>`<div class="g" style="background-image:url('${esc(thumb(g))}')"><div class="g-tools"><button type="button" data-g-move="-1" data-i="${i}" ${i?'':'disabled'}>←</button><button type="button" data-g-del data-i="${i}">✕</button><button type="button" data-g-move="1" data-i="${i}" ${i<gallery.length-1?'':'disabled'}>→</button></div></div>`).join('');$('#postPics').querySelectorAll('[data-pic]').forEach(b=>b.classList.toggle('active',gallery.some(g=>g.post&&g.url===b.dataset.pic)))}
  const st=(t,cls='')=>{const e=$('#st');e.textContent=t;e.className='status '+cls};
  const api=async body=>{const r=await fetch('/api/admin/codex-styles',body?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}:{cache:'no-store'}),d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||`HTTP_${r.status}`);return d};
  // Downscale to ≤1200px and WEBP ≤ ~350 KB before upload.
  async function compress(file){const bmp=await createImageBitmap(file),s=Math.min(1,1200/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);let q=.86,blob;for(let i=0;i<6;i++){blob=await new Promise(r=>c.toBlob(r,'image/webp',q));if(blob&&blob.size<=350*1024)break;q-=.1}if(!blob||blob.size>650*1024)throw new Error('картинка слишком большая');return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result));fr.onerror=rej;fr.readAsDataURL(blob)})}
  function renderList(){$('#list').innerHTML=styles.length?styles.map((s,i)=>`<div class="row${current?.id===s.id?' active':''}" data-id="${esc(s.id)}">${s.image_url?`<img src="${esc(s.image_url)}" alt="">`:'<i></i>'}<div><b>${esc(s.title)}</b><small>${esc(s.model||'без модели')}${s.author?' · @'+esc(s.author):''}</small></div><div class="moves"><button class="btn small" type="button" data-move="-1" ${i?'':'disabled'}>↑</button><button class="btn small" type="button" data-move="1" ${i<styles.length-1?'':'disabled'}>↓</button></div></div>`).join(''):'<div class="empty">Стилей пока нет</div>'}
  function open(s){current=s||null;gallery=(s?.image_keys||[]).map((key,i)=>({key,url:(s.image_urls||[])[i]}));renderGallery();$('#postPics').hidden=true;$('#postPics').innerHTML='';$('#title').value=s?.title||'';renderModels(s?.models||String(s?.model||'').split(',').map(x=>x.trim()).filter(Boolean));$('#author').value=s?.author||'';$('#authorLink').value=s?.author_link||'';$('#sourceUrl').value=s?.source_url||'';$('#prompt').value=s?.prompt||'';$('#del').hidden=!s;st(s?'':'Новый стиль');renderList()}
  async function load(selectId){styles=(await api()).styles||[];open(styles.find(s=>s.id===(selectId||current?.id))||null)}
  $('#new').onclick=()=>open(null);
  $('#pick').onclick=()=>$('#imageInput').click();
  // Import: the same Telegram post parser as a new HUB resource. Fills the form; nothing is saved until «Сохранить».
  $('#analyze').onclick=async()=>{const url=$('#postUrl').value.trim();if(!url){st('Вставь ссылку на пост','bad');return}st('Разбираю пост…');$('#analyze').disabled=true;try{const r=await fetch('/api/admin/hub-telegram-analyze',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url})}),d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||`HTTP_${r.status}`);
      if(!current)open(null);const dr=d.draft||{},src=d.source||{};
      $('#title').value=dr.title||$('#title').value;$('#author').value=(dr.creator||src.channel||'').replace(/^@/,'');$('#authorLink').value=dr.creatorLink||'';$('#sourceUrl').value=src.url||url;$('#prompt').value=dr.descriptionFull||src.rawText||'';
      const pics=(d.media||[]).map(m=>m.url).filter(Boolean),box=$('#postPics');box.hidden=!pics.length;box.innerHTML=pics.map((u,i)=>`<button type="button" data-pic="${esc(u)}" title="Картинка ${i+1}" style="background-image:url('${esc(u)}')"></button>`).join('');
      for(const u of pics)if(gallery.length<MAX&&!gallery.some(g=>g.url===u))gallery.push({url:u,post:true});renderGallery();
      st(pics.length?`Готово: заполнено из поста, картинки (${pics.length}) добавлены в обложки. Лишние убери ✕, порядок — ← →. Проверь текст и сохрани.`:'Готово: заполнено из поста (картинок нет — загрузи вручную). Проверь текст и сохрани.','ok')
    }catch(err){st('Не получилось разобрать пост: '+err.message,'bad')}finally{$('#analyze').disabled=false}};
  $('#postPics').addEventListener('click',e=>{const b=e.target.closest('[data-pic]');if(!b)return;const u=b.dataset.pic,i=gallery.findIndex(g=>g.url===u);if(i>=0)gallery.splice(i,1);else if(gallery.length<MAX)gallery.push({url:u,post:true});else st('Не больше '+MAX+' картинок','bad');renderGallery()});
  $('#gallery').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const i=Number(b.dataset.i);if(b.hasAttribute('data-g-del'))gallery.splice(i,1);else{const j=i+Number(b.dataset.gMove);if(j>=0&&j<gallery.length)[gallery[i],gallery[j]]=[gallery[j],gallery[i]]}renderGallery()});
  $('#imageInput').onchange=async e=>{const files=[...(e.target.files||[])];e.target.value='';if(!files.length)return;let added=0;for(const f of files){if(gallery.length>=MAX){st('Не больше '+MAX+' картинок','bad');break}st(`Сжимаю картинку ${added+1} из ${files.length}…`);try{gallery.push({data:await compress(f)});added++;renderGallery()}catch(err){st('Не получилось: '+err.message,'bad')}}if(added)st(`Добавлено картинок: ${added}. Не забудь сохранить.`,'ok')};
  $('#list').addEventListener('click',async e=>{const row=e.target.closest('.row');if(!row)return;const mv=e.target.closest('[data-move]');if(mv){try{await api({action:'move',id:row.dataset.id,dir:Number(mv.dataset.move)});await load()}catch(err){st('Не получилось: '+err.message,'bad')}return}open(styles.find(s=>s.id===row.dataset.id))});
  $('#form').addEventListener('submit',async e=>{e.preventDefault();st('Сохраняю…');try{const body={action:'set',id:current?.id||'',title:$('#title').value,models:pickedModels(),author:$('#author').value,author_link:$('#authorLink').value,source_url:$('#sourceUrl').value,prompt:$('#prompt').value};body.images=gallery.map(g=>g.key?{key:g.key}:g.data?{data:g.data}:{url:g.url});const d=await api(body);await load(d.id);st('Сохранено. На сайте появится в течение минуты.','ok')}catch(err){st('Не получилось: '+({TITLE_AND_PROMPT_REQUIRED:'нужны название и текст стиля',IMAGE_SIZE:'картинка слишком большая',IMAGE_FORMAT:'это не картинка',IMAGE_FETCH:'не удалось скачать картинку из Telegram — выбери другую или загрузи файл',IMAGE_URL:'картинку можно взять только из поста Telegram',IMAGE_KEY:'картинка устарела — обнови страницу'}[err.message]||err.message),'bad')}});
  $('#del').onclick=async()=>{if(!current||!confirm(`Удалить стиль «${current.title}» вместе с картинками?`))return;try{await api({action:'delete',id:current.id});current=null;await load();st('Удалено.','ok')}catch(err){st('Не получилось: '+err.message,'bad')}};
  load().catch(err=>{$('#list').innerHTML=`<div class="empty">Не удалось загрузить: ${esc(err.message)}</div>`});
})();
</script></body></html>
