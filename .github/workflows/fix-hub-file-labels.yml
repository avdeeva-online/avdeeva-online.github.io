name: fix-hub-file-labels
on:
  push:
    paths:
      - '.github/workflows/fix-hub-file-labels.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix resource download labels
        shell: python
        run: |
          from pathlib import Path
          p=Path('public/hub-dynamic.js')
          s=p.read_text(encoding='utf-8')
          old="const fileLabel=(f,type='resource')=>{const n=String(f?.name||'FILE').trim();if(/regex/i.test(n)&&/\\.json$/i.test(n))return'REGEX JSON';if(/\\.zip$/i.test(n))return`${String(type||'resource').toUpperCase()} ZIP`;return n.replace(/\\.[^.]+$/,'').replace(/[_-]+/g,' ').toUpperCase()||'FILE'};"
          new="const fileLabel=(f,type='resource')=>{const n=String(f?.name||'FILE').trim();if(/regex|регекс|regexp/i.test(n))return'REGEX';if(/\\.zip$/i.test(n)||/preset|пресет/i.test(n))return'PRESET';return n.replace(/\\.[^.]+$/,'').replace(/[_-]+/g,' ').toUpperCase()||'FILE'};"
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old,new),encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/hub-dynamic.js
          git commit -m "Fix TAVO Hub download labels"
          git push
