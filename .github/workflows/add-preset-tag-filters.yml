name: Add preset tag filters
on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-preset-tag-filters.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch TAVO Hub preset filters
        run: python -c "import base64;exec(base64.b64decode('  ...TRUNCATED...  ').decode())"
      - name: Commit changes
        run: |
          git config user.name "archive-exe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/hub.html
          git diff --cached --quiet && exit 0
          git commit -m "Add preset model and setting tag filters"
          git push
