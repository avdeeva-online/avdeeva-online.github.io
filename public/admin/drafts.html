<!doctype html>
<html lang="ru">
<head><link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>Черновики · ARCHIVE ADMIN</title>
<style>
:root{--bg:#0b0e0b;--panel:#11150f;--line:#2f382b;--text:#cbd4c2;--muted:#6f7a69;--accent:#d1bd87;--danger:#b98275;--mono:Consolas,ui-monospace,monospace}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 30% 0,#161d14 0,#0b0e0b 42%);color:var(--text);font-family:var(--mono);min-height:100vh}.shell{width:min(1180px,calc(100% - 28px));margin:28px auto 70px}.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;padding-bottom:16px;border-bottom:1px solid var(--line)}.eyebrow{font-size:9px;letter-spacing:.12em;color:var(--muted)}h1{margin:7px 0 0;font-size:28px;letter-spacing:.05em}.sub{margin-top:7px;color:var(--muted);font-size:9px;line-height:1.55}.section{margin-top:18px;border:1px solid var(--line);background:rgba(17,21,15,.9);padding:16px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.section-head b{font-size:12px;color:#e8dfc5}.count{font-size:8px;color:var(--muted)}.list{display:grid;gap:8px}.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid rgba(75,87,68,.48);background:#0d110c;padding:12px}.item b{display:block;font-size:11px;color:#d8dfcf}.item small{display:block;margin-top:5px;color:var(--muted);font-size:8px;line-height:1.5;word-break:break-word}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.btn{display:inline-block;border:1px solid #475141;background:#131812;color:#d9dfd2;text-decoration:none;padding:8px 10px;font:8px var(--mono);cursor:pointer}.btn:hover{border-color:#706b49;color:#f0e5c4}.btn.danger{border-color:#60473f;color:#d9aaa0;background:#140f0e}.empty{padding:24px;border:1px dashed #303a2c;background:#0c100b;text-align:center;color:#687364;font-size:9px;line-height:1.6}.system-note{font-size:8px;color:#596154}@media(max-width:700px){.item{grid-template-columns:1fr}.actions{justify-content:flex-start}.head{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<main class="shell">
<header class="head"><div><div class="eyebrow">PRIVATE TOOL / ARCHIVE.EXE</div><h1>DRAFTS</h1><div class="sub"></div></div><div class="system-note">RESOURCE DRAFTS</div></header>
<section class="section"><div class="section-head"><b>Черновики ресурсов</b><span class="count" id="resourceCount">загрузка…</span></div><div id="resourceList" class="list"><div class="empty">Загружаю черновики…</div></div></section></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function removeDraft(id,title){if(!confirm(`Удалить черновик «${title||'без названия'}»?`))return;const r=await fetch('/api/admin/telegram-drafts/'+encodeURIComponent(id),{method:'DELETE'}),d=await r.json().catch(()=>({}));if(!r.ok||!d.ok){alert('Не удалось удалить: '+(d.error||r.status));return}load()}
async function load(){const box=document.querySelector('#resourceList'),count=document.querySelector('#resourceCount');try{const r=await fetch('/api/admin/telegram-drafts',{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||r.status);const rows=d.drafts||[];count.textContent=rows.length+' WAITING';if(!rows.length){box.innerHTML='<div class="empty">Черновиков нет.</div>';return}box.innerHTML=rows.map(x=>`<article class="item"><div><b>${esc(x.title||'UNTITLED RESOURCE')}</b><small>${esc((x.type||'other').toUpperCase())} · @${esc(x.creator||'—')} · ${Number(x.source_posts||1)} POST${Number(x.source_posts||1)===1?'':'S'} · ${Number(x.media_count||0)} MEDIA · ${Number(x.file_count||0)} FILES<br>${x.source_url?`<a href="${esc(x.source_url)}" target="_blank" rel="noopener" style="color:#9eaa97">${esc(x.source_url)}</a>`:''}</small></div><div class="actions"><a class="btn" href="/admin/hub/?draft=${encodeURIComponent(x.id)}">Открыть в форме</a><button class="btn danger" type="button" data-delete="${esc(x.id)}" data-title="${esc(x.title||'UNTITLED RESOURCE')}">Удалить</button></div></article>`).join('');box.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>removeDraft(b.dataset.delete,b.dataset.title))}catch(e){count.textContent='ошибка';box.innerHTML=`<div class="empty">Не удалось загрузить черновики · ${esc(e.message||e)}</div>`}}load();
</script>
</body></html>
