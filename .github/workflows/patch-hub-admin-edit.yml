name: Patch TAVO Hub admin edit tools
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-hub-admin-edit.yml'
      - 'public/admin/hub/admin-edit.js'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch admin page
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/admin/hub/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="admin-edit.js?v=1"></script>'
          if tag not in s:
              s=s.replace('</body></html>', tag+'\n</body></html>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/admin/hub/index.html
          git commit -m 'Enable TAVO Hub resource editing in admin'
          git push
